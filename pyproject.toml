[project]
name = "to-do-list"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django>=5.2.8,<6",
    "django-allauth[socialaccount]>=65,<66",
]

[dependency-groups]
dev = [
    "ruff>=0.17.1",
]

[tool.ruff]
# Django generates the migration files.
extend-exclude = ["**/migrations"]
