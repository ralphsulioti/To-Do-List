<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <title>Django Google Sign In</title>
</head>
<body>
    {% load socialaccount %}
    <div class="container-fluid">
        <h1><p class="text-success text-center">To-Do List</p></h1>
        {% for message in messages %}
        <div class="alert alert-{{ message.tags }} text-center">{{ message }}</div>
        {% endfor %}

        {% if user.is_authenticated %}
        <h3><p class="text-center">You are signed in as <u>{{ user.email|default:user.username }}</u></p></h3>
        <h4><form class="text-center" method="post" action="{% url 'account_logout' %}">
            {% csrf_token %}
            <button type="submit">Logout</button>
        </form></h4>
        {% else %}
        {% if google_login_enabled %}
        <h4><form class="text-center" method="post" action="{% provider_login_url 'google' next='/' %}">
            {% csrf_token %}
            <button type="submit">Sign in with Google</button>
        </form></h4>
        {% endif %}
        <h4><p class="text-center">
            <a href="{% url 'account_login' %}"><button>Log in</button></a>
            <a href="{% url 'account_signup' %}"><button>Sign up</button></a>
        </p></h4>
        {% endif %}
        <h4><p class="text-center"><a href="{% url 'lists_index' %}"><button>My Lists</button></a></p></h4>
    </div>
    <br><br><br><br><br><br><br><br><br><br>
    <figure class="text-center">
      <blockquote class="blockquote">
          <h3><p class="text-success">"A goal without a plan is just a wish"</p></h3>
      </blockquote>
      <h4><figcaption class="blockquote-footer"><p class="text-success">
        -Antoine de Saint-Exupery
      </p></figcaption></h4>
    </figure>
</body>
</html>
